# Plantilla procesada por el entrypoint oficial de Nginx.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
limit_req_zone $client_ip zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    autoindex off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Swagger se usa por Tailscale directamente contra el backend.
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=auth burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://${BACKEND_TAILSCALE_IP}:${APP_PORT}/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /api/ {
        proxy_pass http://${BACKEND_TAILSCALE_IP}:${APP_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
