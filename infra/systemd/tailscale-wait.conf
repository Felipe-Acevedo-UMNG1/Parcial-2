# Drop-in de mysql.service en db y docker.service en nodos con contenedores.
# /etc/examen-node.env debe contener TAILSCALE_NODE_IP=<IP de ESTA máquina>.
[Unit]
Requires=tailscaled.service
After=tailscaled.service network-online.target

[Service]
EnvironmentFile=/etc/examen-node.env
ExecStartPre=/usr/local/sbin/wait-tailscale-ip
TimeoutStartSec=180
